litellm_settings:
  drop_params: true
  request_timeout: 15
  callbacks: ["custom_callbacks.refusal_interceptor"]
  cache: true
  cache_params:
    type: "redis"
    host: os.environ/REDIS_HOST
    port: 6379
    ttl: 3600

model_list:
  # ==================== IMAGE GENERATION DEPLOYMENTS ====================
  - model_name: gemini-2.5-flash-image
    litellm_params:
      model: gemini/gemini-2.5-flash-image
      api_key: os.environ/GEMINI_API_KEY
      request_timeout: 30

  - model_name: imagen-3-studio
    litellm_params:
      model: gemini/imagen-3.0-generate-002
      api_key: os.environ/GEMINI_API_KEY
      request_timeout: 30

  - model_name: imagen-3-vertex
    litellm_params:
      model: vertex_ai/imagen-3.0-generate-002
      custom_llm_provider: vertex_ai
      vertex_project: os.environ/VERTEX_PROJECT
      vertex_location: "us-central1"
      request_timeout: 30
  # ==================== GEMINI FLASH AUTO DEPLOYMENTS ====================
  - model_name: flash-auto
    litellm_params:
      model: gemini/gemini-3.7-flash
      api_key: os.environ/GEMINI_API_KEY
      request_timeout: 15
      reasoning_effort: "medium"
      safety_settings:
        - category: HARM_CATEGORY_HARASSMENT
          threshold: BLOCK_NONE
        - category: HARM_CATEGORY_HATE_SPEECH
          threshold: BLOCK_NONE
        - category: HARM_CATEGORY_SEXUALLY_EXPLICIT
          threshold: BLOCK_NONE
        - category: HARM_CATEGORY_DANGEROUS_CONTENT
          threshold: BLOCK_NONE
        - category: HARM_CATEGORY_CIVIC_INTEGRITY
          threshold: BLOCK_NONE
    model_info:
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0

